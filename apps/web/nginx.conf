server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Swarm embedded DNS — lets us resolve the `api` service at request
    # time so nginx doesn't crash on boot if the API isn't up yet.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback — all client routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy → internal Fastify service on the overlay network
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
