# Only set the Connection header to "upgrade" when the client actually asked
# for one (real WebSocket handshakes send an Upgrade header) — otherwise
# plain HTTP requests through the same /api/ block keep normal keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Swarm embedded DNS — lets us resolve the `api` service at request
    # time so nginx doesn't crash on boot if the API isn't up yet.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback — all client routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy → internal Fastify service on the overlay network.
    # Includes WebSocket upgrade support for /api/v1/ws (live ticket updates) —
    # without the Upgrade/Connection headers, nginx silently downgrades the
    # handshake to a plain HTTP request and the client never sees a socket.
    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSocket connections are long-lived and only produce traffic on
        # this server's ~30s heartbeat ping — keep this comfortably above
        # that so an idle-but-healthy socket never gets reaped by the proxy.
        proxy_read_timeout 3600s;
    }

    location = /health {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
