    <title>ForgePSA — Modern PSA for MSPs</title>

      content="ForgePSA is a modern Professional Services Automation platform built by an MSP, for MSPs. Tickets, contracts, billing, customer portal, and native NinjaRMM integration. 45-day free trial, no credit card."

    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="ForgePSA — Modern PSA for MSPs" />

    <meta name="twitter:image" content="https://forgepsa.com/og-image.svg" />

    <!-- Structured data: SoftwareApplication + Organization for rich snippets and AI extraction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ForgePSA",
        "url": "https://forgepsa.com",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Professional Services Automation",
        "operatingSystem": "Web, iOS Safari, Android Chrome",
        "description": "Modern Professional Services Automation (PSA) for managed service providers (MSPs). Tickets, time tracking, contracts, recurring invoicing, customer portal, product catalog, and native NinjaRMM integration. Built by an MSP, for MSPs.",
        "image": "https://forgepsa.com/og-image.svg",
        "softwareVersion": "0.3",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1",
          "bestRating": "5"
        },
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "49", "priceCurrency": "USD", "description": "Per technician per month. Up to 3 techs." },
          { "@type": "Offer", "name": "Pro", "price": "79", "priceCurrency": "USD", "description": "Per technician per month. 4-15 techs. All integrations." },
          { "@type": "Offer", "name": "Enterprise", "price": "0", "priceCurrency": "USD", "description": "Custom pricing for 16+ techs. SAML SSO and dedicated instance." }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",

        "url": "https://forgepsa.com",

          { "@type": "ContactPoint", "contactType": "billing", "email": "billing@forgepsa.com" }
        ]
