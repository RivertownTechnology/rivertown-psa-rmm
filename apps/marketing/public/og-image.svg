<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <!-- Decorative blurred blobs -->
  <circle cx="150" cy="120" r="220" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="1050" cy="520" r="260" fill="#67e8f9" opacity="0.3"/>

  <!-- Large mark -->
  <g transform="translate(120, 180)">
    <rect width="180" height="180" rx="38" fill="url(#og-mark)"/>
    <g fill="#ffffff" transform="scale(2.8125)">
      <path d="M 20 16 L 40 16 L 44 22 L 40 28 L 20 28 Z" opacity="0.95"/>
      <rect x="29" y="24" width="6" height="22" rx="2" transform="rotate(-18 32 35)"/>
      <path d="M 12 48 L 52 48 L 54 52 L 10 52 Z"/>
      <path d="M 10 52 L 6 52 L 8 50 L 10 50 Z"/>
      <circle cx="48" cy="22" r="1.5" opacity="0.7"/>
      <circle cx="50" cy="26" r="1" opacity="0.5"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(340, 200)">
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="800" fill="#0f172a" letter-spacing="-2">
      Forge<tspan fill="#2563eb">PSA</tspan>
    </text>
    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#475569">
      The all-in-one PSA + RMM for modern MSPs
    </text>
    <text x="0" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#64748b">
      Built by an MSP, for MSPs · 45-day free trial · No credit card
    </text>
  </g>

  <!-- Bottom domain bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="70" fill="#0f172a"/>
    <text x="60" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#ffffff">
      forgepsa.com
    </text>
    <text x="1140" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" text-anchor="end">
      PSA · RMM · Customer Portal · Billing · AI
    </text>
  </g>
</svg>
