# Rivertown PSA/RMM — single-host production stack (plain Docker + Portainer).
#
# Deploy this in Portainer as a **Compose** stack (NOT a Swarm stack) on one
# x86 Docker host. The legacy Swarm version is infrastructure/docker/stack.yml.
#
# Set these as stack environment variables in Portainer (Stacks → your stack →
# Environment variables), so no secrets live in this file:
#   REGISTRY            e.g. ghcr.io/rivertowntechnology
#   TAG                 image tag to run (e.g. "latest")
#   ACME_EMAIL          email for Let's Encrypt registration
#   POSTGRES_PASSWORD   database password
#   JWT_SECRET          JWT signing secret
#   ENCRYPTION_KEY      64-hex-char AES key for integration_configs encryption at rest
#   MS_CLIENT_SECRET, MS_PORTAL_CLIENT_SECRET   Entra client secrets
#   (plus any other integration keys on the api service: STRIPE_SECRET_KEY, ANTHROPIC_API_KEY, ...)
#
# Hostnames are hardcoded to psa./portal.rivertowntechnology.com to match the
# Entra app redirect URIs. Change them here AND in Azure together if they differ.

networks:
  edge:
    name: rivertown_edge   # explicit name so Traefik's provider.docker.network matches
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
  redis_data:
  traefik_certs:
  mosquitto_data:
  mosquitto_log:

services:
  # ── Ingress: TLS termination + Let's Encrypt ────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=rivertown_edge
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/certs/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
    networks:
      - edge

  # ── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivertown
      POSTGRES_DB: rivertown
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # LAN-only admin access (pgAdmin etc.) — do NOT forward 5432 on the router.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivertown"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MQTT broker for the RMM agent (internal only for now).
  mosquitto:
    image: ${REGISTRY}/rivertown-mqtt:${TAG}
    restart: unless-stopped
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - internal

  # ── API (Fastify) ───────────────────────────────────────────────────────
  api:
    image: ${REGISTRY}/rivertown-api:${TAG}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_USER: rivertown
      POSTGRES_DB: rivertown
      DATABASE_URL: postgresql://rivertown:${POSTGRES_PASSWORD}@postgres:5432/rivertown
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://psa.rivertowntechnology.com,https://portal.rivertowntechnology.com
      API_BASE_URL: https://psa.rivertowntechnology.com
      PASSKEY_RP_ID: portal.rivertowntechnology.com
      PASSKEY_ORIGIN: https://portal.rivertowntechnology.com
      # ── Microsoft 365 (App A: single-tenant; App B: multi-tenant portal) ──
      MS_TENANT_ID: "607af42d-3de0-4644-aea7-69b417d5eef9"
      MS_CLIENT_ID: "7d177652-0182-458e-9ee7-6d97ef428bbd"
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_REDIRECT_URI: https://psa.rivertowntechnology.com/api/v1/auth/microsoft/callback
      MS_CALENDAR_REDIRECT_URI: https://psa.rivertowntechnology.com/settings/microsoft-calendar/callback
      MS_PORTAL_CLIENT_ID: "4e6dfe4f-18bf-4473-ba40-2857775b3f83"
      MS_PORTAL_CLIENT_SECRET: ${MS_PORTAL_CLIENT_SECRET}
      MS_PORTAL_REDIRECT_URI: https://portal.rivertowntechnology.com/api/v1/portal/auth/microsoft/callback
      PORTAL_URL: https://portal.rivertowntechnology.com
      # Other integration keys (STRIPE_SECRET_KEY, ANTHROPIC_API_KEY, ...) —
      # add here or as Portainer stack env vars as needed.
    depends_on:
      - postgres
      - redis
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ── Admin dashboard (static SPA + nginx, proxies /api → api) ─────────────
  web:
    image: ${REGISTRY}/rivertown-web:${TAG}
    restart: unless-stopped
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`psa.rivertowntechnology.com`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=le
      - traefik.http.services.web.loadbalancer.server.port=80

  # ── Customer portal (static SPA + nginx, proxies /api → api) ────────────
  portal:
    image: ${REGISTRY}/rivertown-portal:${TAG}
    restart: unless-stopped
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.portal.rule=Host(`portal.rivertowntechnology.com`)
      - traefik.http.routers.portal.entrypoints=websecure
      - traefik.http.routers.portal.tls.certresolver=le
      - traefik.http.services.portal.loadbalancer.server.port=80
